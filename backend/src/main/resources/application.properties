# Application Configuration
spring.application.name=Biometric Stress Analysis System
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/stress_analysis_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=biometric-stress-analysis-secret-key-change-in-production-2024
jwt.expiration=86400000

# Logging Configuration
logging.level.com.biometric.stressanalysis=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# API Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
